[versions]
# common libraries
adventure = "5.2.0"
annotations = "26.1.0"
codec4j = "0.2.0-beta.6"
event4j = "4.1.0"
jfun = "1.0.0-beta.3"
slf4j = "2.0.18"

# for testing
junit = "6.1.3"
mockito = "5.10.0"

# gradle plugins
gradle-plugins = "1.8.5"
run-task = "3.1.0"

# platform api
paper = "26.2.build.119-stable"
velocity = "4.1.1"

# other plugins
luckperms = "5.5"
placeholderapi = "2.12.3"
vault = "1.7.1"

[libraries]

# common libraries
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
adventure = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-text-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }
adventure-text-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
adventure-text-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
codec4j-api = { module = "dev.siroshun.codec4j:codec4j-api", version.ref = "codec4j" }
codec4j-io-yaml = { module = "dev.siroshun.codec4j:codec4j-io-yaml", version.ref = "codec4j" }
event4j-api = { module = "dev.siroshun.event4j:event4j-api", version.ref = "event4j" }
event4j-tree = { module = "dev.siroshun.event4j:event4j-tree", version.ref = "event4j" }
jfun-result = { module = "dev.siroshun.jfun:jfun-result", version.ref = "jfun" }
slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# for testing
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

# platform api
platform-paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
platform-velocity = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }

# other plugins
integration-luckperms = { module = "net.luckperms:api", version.ref = "luckperms" }
integration-placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi"}
integration-vault = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault" }

[plugins]

bundler = { id = "dev.siroshun.gradle.plugins.bundler", version.ref = "gradle-plugins" }
jcommon = { id = "dev.siroshun.gradle.plugins.jcommon", version.ref = "gradle-plugins" }
mavenPublication = { id = "dev.siroshun.gradle.plugins.maven-publication", version.ref = "gradle-plugins" }

run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
run-velocity = { id = "xyz.jpenilla.run-velocity", version.ref = "run-task" }
